# GO2 Robot SDK — Docker Compose (base file, always required)
#
# Quick start:
#   Windows 11 (hardware):    ROBOT_IP=192.168.x.x docker-compose up
#   Windows 11 (simulation):  USE_SIM=true docker-compose up
#   Jetson NX 16 GB:          ROBOT_IP=x.x.x.x docker-compose -f docker/docker-compose.yml -f docker/docker-compose.jetson.yml up
#
# Microphone (Windows 11): open http://localhost:8888 in your browser after starting.
#
# Full documentation — env vars, platform guide, recipes, troubleshooting:
#   docs/docker.md
#
# (* = default value)

services:
  go2_ros2:
    image: go2-ros2-sdk:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      pull: false   # Don't pull ros:jazzy-ros-base from the registry on every build.
                    # Without this, a new upstream digest busts the entire layer cache.
                    # To intentionally update the base image: docker pull ros:jazzy-ros-base
    entrypoint: ["/ros2_ws/src/docker/entrypoint.sh"]
    environment:
      # ── Mode ──────────────────────────────────────────────────────────────
      - USE_SIM=${USE_SIM:-false}

      # ── Hardware connection ────────────────────────────────────────────────
      - ROBOT_IP=${ROBOT_IP:-}
      - CONN_TYPE=${CONN_TYPE:-webrtc}                  # webrtc* | cyclonedds
      - WEBRTC_SERVER_HOST=0.0.0.0
      - WEBRTC_SERVER_PORT=${WEBRTC_SERVER_PORT:-9991}
      - ROBOT_TOKEN=${ROBOT_TOKEN:-}

      # ── CycloneDDS (only used when CONN_TYPE=cyclonedds) ──────────────────
      # RMW_IMPLEMENTATION is intentionally left unset here so WebRTC mode uses
      # the default RMW (FastDDS). Set RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # explicitly when CONN_TYPE=cyclonedds.
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-}
      - CYCLONEDDS_IFACE=${CYCLONEDDS_IFACE:-eth0}
      - CYCLONEDDS_URI=<CycloneDDS><Domain Id="any"><General><Interfaces><NetworkInterface name="${CYCLONEDDS_IFACE:-eth0}" priority="default" multicast="default"/></Interfaces></General></Domain></CycloneDDS>

      # ── Map / LiDAR ────────────────────────────────────────────────────────
      - MAP_SAVE=${MAP_SAVE:-false}
      - MAP_NAME=${MAP_NAME:-3d_map}

      # ── Language ───────────────────────────────────────────────────────────
      - VOICE_LANG=${VOICE_LANG:-en}                   # MASTER language knob: en* | id
                                                        # Focuses STT + NLU + TTS on ONE language.
                                                        # Robot command output always stays English.

      # ── TTS ────────────────────────────────────────────────────────────────
      - TTS_PROVIDER=${TTS_PROVIDER:-supertonic}        # supertonic* | openai | elevenlabs | gemini
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}             # required for openai TTS/STT/NLU
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}     # required only when TTS_PROVIDER=elevenlabs
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}             # required when using any gemini provider
      - TTS_VOICE=${TTS_VOICE:-F1}                     # supertonic: M1–M5 (male), F1–F5 (female)*
                                                        # openai: alloy | echo | fable | onyx | nova | shimmer
                                                        # elevenlabs: voice ID string
                                                        # gemini: Kore | Zephyr | Puck | …
      - SUPERTONIC_LANG=${SUPERTONIC_LANG:-}           # TTS-only override; empty → follows VOICE_LANG
                                                        # (set to any of Supertonic's 31 ISO codes if needed)
      - SUPERTONIC_STEPS=${SUPERTONIC_STEPS:-8}        # quality steps: 5 (fast) → 12 (best)

      # ── STT ────────────────────────────────────────────────────────────────
      - ENABLE_STT=${ENABLE_STT:-true}
      - MIC_BRIDGE=${MIC_BRIDGE:-true}                 # true* → mic_bridge_node (browser, http://localhost:8888)
                                                        # false → stt_node (needs /dev/snd or PulseAudio)
      - STT_PROVIDER=${STT_PROVIDER:-faster_whisper}
        # faster_whisper* — transcription only → voice_cmd_node → tts_node
        # gemma_local     — unified: audio → wake word + command + text (1 llama.cpp call)
        # openai_realtime — unified: audio → wake word + command + audio (OpenAI gpt-realtime-2)
        # gemini_live     — unified: audio → wake word + command + audio (Gemini 2.5 Flash Live)
        # openai / gemini — transcription only (cloud Whisper / Gemini REST, legacy)
      - STT_SOURCE=${STT_SOURCE:-mic}                  # mic* (local sounddevice) | robot (GO2 onboard mic via WebRTC → /robot_audio)
                                                        # robot requires CONN_TYPE=webrtc and MIC_BRIDGE=false
      - STT_DEVICE=${STT_DEVICE:-cpu}                   # cpu* | cuda (windows-gpu profile sets cuda explicitly)
      - WHISPER_MODEL=${WHISPER_MODEL:-base}           # tiny | base* | small | medium
                                                        # STT language follows VOICE_LANG (above)
      - VAD_SILENCE_DURATION=${VAD_SILENCE_DURATION:-0.4}  # seconds of silence before utterance is sent to STT

      # ── Voice commands ─────────────────────────────────────────────────────
      - ENABLE_VOICE_CMD=${ENABLE_VOICE_CMD:-true}
      - NLU_PROVIDER=${NLU_PROVIDER:-keyword}          # keyword* | openai | gemini | gemma_local
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-true}   # cloud/local NLU only — DuckDuckGo search for non-command speech
      - VOICE_MOVE_DURATION=${VOICE_MOVE_DURATION:-2.0}
      - VOICE_LINEAR_SPEED=${VOICE_LINEAR_SPEED:-0.3}
      - VOICE_ANGULAR_SPEED=${VOICE_ANGULAR_SPEED:-0.5}

      # ── Knowledge-base RAG (Modul 3.2) — venue Q&A grounding ───────────────
      - ENABLE_KB=${ENABLE_KB:-false}                  # true → ground conversational replies on a venue KB (needs LLM NLU_PROVIDER)
      - KB_VENUE=${KB_VENUE:-museum_demo}              # bundled sample venue folder under speech_processor/knowledge/
      - KB_PATH=${KB_PATH:-}                           # absolute dir override; empty → bundled KB_VENUE. Mount real venue facts here
      - KB_EMBED_PROVIDER=${KB_EMBED_PROVIDER:-local}  # local* (multilingual-e5, CPU) | openai (text-embedding-3-small) | hashing
      - KB_MODEL=${KB_MODEL:-intfloat/multilingual-e5-small}   # sentence-transformers model when KB_EMBED_PROVIDER=local
      - KB_TOP_K=${KB_TOP_K:-3}                         # snippets injected into the prompt per question
      - KB_MIN_SCORE=${KB_MIN_SCORE:-0.0}              # cosine floor; raise to suppress weak matches

      # ── Multi-turn conversation memory (Modul 3.4) ────────────────────────
      - ENABLE_CONV_MEMORY=${ENABLE_CONV_MEMORY:-true}     # rolling memory of recent exchanges (LLM NLU only)
      - CONV_HISTORY_TURNS=${CONV_HISTORY_TURNS:-3}        # exchanges kept as context (user+robot pairs)
      - CONV_HISTORY_IDLE_SEC=${CONV_HISTORY_IDLE_SEC:-60} # clear memory after this many seconds of silence (new visitor)

      # ── Gemma / llama.cpp ──────────────────────────────────────────────────
      - LLAMA_CPP_HOST=${LLAMA_CPP_HOST:-http://llama_cpp:8080}  # llama.cpp sidecar (docker-compose.windows-gpu.yml)
      - GEMMA_MODEL=${GEMMA_MODEL:-gemma}                        # model label passed to /v1/chat/completions
      - ENABLE_GEMMA_VISION=${ENABLE_GEMMA_VISION:-false} # true → start gemma_vision_node (scene description)
      - GEMMA_VISION_RATE=${GEMMA_VISION_RATE:-0.5}       # Hz — inference frequency for gemma_vision_node
      - WAKE_WORD=${WAKE_WORD:-elliot}                     # STT wake word; LLM backends detect via structured output

      # ── Logging / rosbag capture ───────────────────────────────────────────
      - ENABLE_BAG=${ENABLE_BAG:-false}                # true → record a timestamped rosbag2 session (hardware mode)
      - BAG_DIR=${BAG_DIR:-/root/bags}                 # in-container dir; persisted to ./bags on the host (see volumes)
      - BAG_TOPICS=${BAG_TOPICS:-}                     # empty → curated debug set; "-a" → everything (camera+LiDAR)
      - BAG_STORAGE=${BAG_STORAGE:-}                   # empty → rosbag2 default (mcap on Jazzy); or sqlite3

      # ── VNC ────────────────────────────────────────────────────────────────
      - DISPLAY=:1
      - VNC_RESOLUTION=${VNC_RESOLUTION:-1920x1080}

    ports:
      - "5901:5901"   # VNC    — connect with any VNC client to localhost:5901
      - "8765:8765"   # Foxglove WebSocket — ws://localhost:8765
      - "8888:8888"   # mic_bridge_node HTML page — open in host browser for microphone input
      - "8889:8889"   # mic_bridge_node WebSocket — browser streams PCM audio here
      - "9991:9991"   # WebRTC signalling

    volumes:
      - ../bags:/root/bags   # rosbag2 sessions (ENABLE_BAG=true) persisted to ./bags in the repo root

    # Explicit bridge networking.
    # To use host networking instead (simplifies ROS2 DDS discovery):
    #   replace the ports block above with: network_mode: "host"

    privileged: true      # Required for hardware /dev access (serial, GPIO, etc.)
    devices:
      - /dev/input:/dev/input  # Joystick / gamepad
      - /dev/snd:/dev/snd      # Microphone — works on native Linux and Jetson (stt_node).
                               # On Windows (Docker Desktop + WSL2) /dev/snd is not
                               # exposed; use the browser mic bridge at http://localhost:8888.

    # ── GPU (optional) ─────────────────────────────────────────────────────
    # Uncomment to enable NVIDIA GPU inside the container.
    # Required for: STT_DEVICE=cuda (faster-whisper), GPU-accelerated Gazebo rendering.
    # Works on:
    #   - Windows PC with RTX GPU: Docker Desktop + WSL2 + nvidia-container-toolkit
    #     Setup guide: https://docs.nvidia.com/cuda/wsl-user-guide/index.html
    #   - Native Linux with NVIDIA GPU: install nvidia-container-toolkit
    #   - Jetson NX: use docker-compose.jetson.yml override instead (different base image)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    restart: unless-stopped
