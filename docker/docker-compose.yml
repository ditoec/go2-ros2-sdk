# GO2 Robot SDK — Docker Compose
#
# Single image, two modes — switch with USE_SIM:
#
#   Hardware (real robot):
#     ROBOT_IP=192.168.x.x CONN_TYPE=webrtc docker-compose up
#
#   Simulation (Gazebo, no robot required):
#     USE_SIM=true docker-compose up
#
# Build once, run either mode:
#     docker-compose build
#
# ─────────────────────────────────────────────────────────────────────────────
# ENVIRONMENT VARIABLE REFERENCE
# ─────────────────────────────────────────────────────────────────────────────
#
# ── Mode ─────────────────────────────────────────────────────────────────────
#   USE_SIM            false* | true
#                      false → hardware driver (needs ROBOT_IP)
#                      true  → Gazebo Harmonic simulation (no robot required)
#
# ── Hardware connection (ignored when USE_SIM=true) ──────────────────────────
#   ROBOT_IP           Robot IP address, e.g. 192.168.12.1
#                      Comma-separated for multi-robot: 192.168.12.1,192.168.12.2
#   CONN_TYPE          webrtc* | cyclonedds
#                      webrtc     → Wi-Fi via aiortc (close the Unitree app first)
#                      cyclonedds → Ethernet / onboard Jetson (stubs only — not fully implemented)
#   WEBRTC_SERVER_PORT 9991*   WebRTC signalling port
#   ROBOT_TOKEN        ""*     API token (required by some firmware versions)
#
# ── Map / LiDAR ──────────────────────────────────────────────────────────────
#   MAP_SAVE           false* | true   Save .ply point cloud every 10 s
#   MAP_NAME           3d_map*         Filename prefix for saved .ply files
#
# ── TTS — Text-to-Speech (always running) ────────────────────────────────────
#   TTS_PROVIDER       openai* | elevenlabs | gemini
#                      openai     → tts-1-hd, needs OPENAI_API_KEY
#                      elevenlabs → high-quality expressive voice, needs ELEVENLABS_API_KEY
#                      gemini     → gemini-2.5-flash-tts-preview, needs GEMINI_API_KEY
#   OPENAI_API_KEY     ""*   Shared by TTS (openai), STT (openai), and voice NLU (openai)
#   ELEVENLABS_API_KEY ""*   Required only when TTS_PROVIDER=elevenlabs
#   GEMINI_API_KEY     ""*   Required when TTS_PROVIDER=gemini, STT_PROVIDER=gemini, or NLU_PROVIDER=gemini
#   TTS_VOICE          nova* (openai) | XrExE9yKIg1WjnnlVkGX (elevenlabs) | Kore* (gemini)
#                      OpenAI voices:  alloy, echo, fable, onyx, nova, shimmer
#                      Gemini voices:  Kore, Zephyr, Puck, Charon, Fenrir, Leda, Orus, Aoede, Callirrhoe
#
# ── STT — Speech-to-Text (opt-in) ────────────────────────────────────────────
#   ENABLE_STT         false* | true   Start stt_node (requires microphone via /dev/snd)
#   STT_PROVIDER       openai* | faster_whisper | vosk | gemini
#                      openai         → OpenAI Whisper API, needs OPENAI_API_KEY, ~1-2 s latency
#                      faster_whisper → local CTranslate2, ~30 ms on GPU / ~300 ms on CPU
#                      vosk           → streaming Kaldi/LSTM, ~50 ms, lowest RAM
#                      gemini         → gemini-2.5-flash, needs GEMINI_API_KEY, ~1-2 s latency
#   STT_DEVICE         cpu* | cuda
#                      cuda requires nvidia-container-toolkit + uncommented deploy block below
#   WHISPER_MODEL      base* | tiny | small | medium   (faster_whisper only)
#   STT_LANGUAGE       en*   Whisper language code
#
# ── Voice commands (opt-in, requires ENABLE_STT=true) ────────────────────────
#   ENABLE_VOICE_CMD   false* | true   Start voice_cmd_node
#                      Translates spoken phrases → robot commands (/webrtc_req or /sim_cmd)
#                      and movement (/cmd_vel_voice → twist_mux priority 7)
#   NLU_PROVIDER       keyword* | openai | gemini | claude
#                      keyword → regex pattern matching, instant, fully offline
#                      openai  → GPT-4o-mini, handles free-form phrasing, needs OPENAI_API_KEY
#                      gemini  → gemini-2.5-flash JSON output, handles free-form phrasing, needs GEMINI_API_KEY
#                      claude  → claude-haiku-4-5, JSON output, handles free-form phrasing, needs ANTHROPIC_API_KEY
#   VOICE_MOVE_DURATION 2.0*  Seconds to drive before auto-stopping movement commands
#   VOICE_LINEAR_SPEED  0.3*  m/s for forward / backward voice commands
#   VOICE_ANGULAR_SPEED 0.5*  rad/s for turn left / right voice commands
#
# ── VNC desktop ──────────────────────────────────────────────────────────────
#   VNC_RESOLUTION     1920x1080*   VNC screen resolution
#   VNC_PASSWORD       ros2vnc*     Override at runtime: VNC_PASSWORD=mypass docker-compose up
#
# ── Ports ────────────────────────────────────────────────────────────────────
#   5901   VNC         Connect with any VNC client to localhost:5901
#   8765   Foxglove    Open Foxglove Studio → WebSocket → ws://localhost:8765
#   9991   WebRTC      Signalling server used by the go2_webrtc_connect library
#
# (* = default value)
# ─────────────────────────────────────────────────────────────────────────────

services:
  go2_ros2:
    image: go2-ros2-sdk:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      pull: false   # Don't pull ros:jazzy-ros-base from the registry on every build.
                    # Without this, a new upstream digest busts the entire layer cache.
                    # To intentionally update the base image: docker pull ros:jazzy-ros-base
    entrypoint: ["/ros2_ws/src/docker/entrypoint.sh"]
    environment:
      # ── Mode ──────────────────────────────────────────────────────────────
      - USE_SIM=${USE_SIM:-false}

      # ── Hardware connection ────────────────────────────────────────────────
      - ROBOT_IP=${ROBOT_IP:-}
      - CONN_TYPE=${CONN_TYPE:-webrtc}
      - WEBRTC_SERVER_HOST=0.0.0.0
      - WEBRTC_SERVER_PORT=${WEBRTC_SERVER_PORT:-9991}
      - ROBOT_TOKEN=${ROBOT_TOKEN:-}

      # ── Map / LiDAR ────────────────────────────────────────────────────────
      - MAP_SAVE=${MAP_SAVE:-false}
      - MAP_NAME=${MAP_NAME:-3d_map}

      # ── TTS ────────────────────────────────────────────────────────────────
      - TTS_PROVIDER=${TTS_PROVIDER:-openai}           # openai* | elevenlabs | gemini
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}             # required for openai TTS/STT/NLU
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}     # required only when TTS_PROVIDER=elevenlabs
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}             # required when using any gemini provider
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}       # required when NLU_PROVIDER=claude
      - TTS_VOICE=${TTS_VOICE:-nova}                   # nova* (openai) | ElevenLabs ID | Kore (gemini)

      # ── STT ────────────────────────────────────────────────────────────────
      - ENABLE_STT=${ENABLE_STT:-false}
      - STT_PROVIDER=${STT_PROVIDER:-openai}           # openai* | faster_whisper | vosk | gemini
      - STT_DEVICE=${STT_DEVICE:-cpu}                  # cpu* | cuda
      - WHISPER_MODEL=${WHISPER_MODEL:-base}           # tiny | base* | small | medium
      - STT_LANGUAGE=${STT_LANGUAGE:-en}

      # ── Voice commands ─────────────────────────────────────────────────────
      - ENABLE_VOICE_CMD=${ENABLE_VOICE_CMD:-false}
      - NLU_PROVIDER=${NLU_PROVIDER:-keyword}          # keyword* | openai | gemini | claude
      - VOICE_MOVE_DURATION=${VOICE_MOVE_DURATION:-2.0}
      - VOICE_LINEAR_SPEED=${VOICE_LINEAR_SPEED:-0.3}
      - VOICE_ANGULAR_SPEED=${VOICE_ANGULAR_SPEED:-0.5}

      # ── VNC ────────────────────────────────────────────────────────────────
      - DISPLAY=:1
      - VNC_RESOLUTION=${VNC_RESOLUTION:-1920x1080}

    ports:
      - "5901:5901"   # VNC    — connect with any VNC client to localhost:5901
      - "8765:8765"   # Foxglove WebSocket — ws://localhost:8765
      - "9991:9991"   # WebRTC signalling

    # Explicit bridge networking.
    # To use host networking instead (simplifies ROS2 DDS discovery):
    #   replace the ports block above with: network_mode: "host"

    privileged: true      # Required for hardware /dev access (serial, GPIO, etc.)
    devices:
      - /dev/input:/dev/input  # Joystick / gamepad
      - /dev/snd:/dev/snd      # Microphone — required by stt_node when ENABLE_STT=true

    # ── GPU (optional) ─────────────────────────────────────────────────────
    # Uncomment to enable NVIDIA GPU inside the container.
    # Required for: STT_DEVICE=cuda (faster-whisper), GPU-accelerated Gazebo rendering.
    # Works on:
    #   - Windows PC with RTX GPU: Docker Desktop + WSL2 + nvidia-container-toolkit
    #     Setup guide: https://docs.nvidia.com/cuda/wsl-user-guide/index.html
    #   - Native Linux with NVIDIA GPU: install nvidia-container-toolkit
    #   - Jetson NX: use docker-compose.jetson.yml override instead (different base image)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    restart: unless-stopped
