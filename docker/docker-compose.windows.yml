# Docker Compose override for Windows 11 with Docker Desktop + WSL2
#
# Provides microphone access to stt_node via WSLg's built-in PulseAudio server.
# Required because WSL2 does not expose /dev/snd, so the base docker-compose.yml
# device mapping has no effect on Windows.
#
# Two things are needed for the PulseAudio connection to succeed:
#   1. The Unix socket  — /mnt/wslg/runtime-dir/pulse/native
#   2. The auth cookie  — /mnt/wslg/.config/pulse/cookie
#      (WSLg's PA server rejects connections without the matching cookie)
#
# Prerequisites:
#   - Windows 11 (any build — WSLg is included by default)
#   - Docker Desktop 4.x+ with WSL2 backend
#   - Verify both WSLg files exist before running:
#       wsl ls /mnt/wslg/runtime-dir/pulse/native
#       wsl ls /mnt/wslg/.config/pulse/cookie
#   - If either is missing: wsl --update && restart Docker Desktop
#
# Usage:
#   # Hardware mode
#   ROBOT_IP=192.168.x.x \
#     docker-compose -f docker/docker-compose.yml \
#                    -f docker/docker-compose.windows.yml up
#
#   # Simulation mode (microphone works identically)
#   USE_SIM=true \
#     docker-compose -f docker/docker-compose.yml \
#                    -f docker/docker-compose.windows.yml up
#
# Windows 10 / WSL2 without WSLg:
#   WSLg is not available. Use a cloud STT provider with STT_PROVIDER=openai or
#   STT_PROVIDER=gemini, or disable STT with ENABLE_STT=false.

services:
  go2_ros2:
    volumes:
      - /mnt/wslg/runtime-dir/pulse:/tmp/pulse
      - /mnt/wslg/.config/pulse/cookie:/root/.config/pulse/cookie:ro
    environment:
      - PULSE_SERVER=unix:/tmp/pulse/native
      - PULSE_COOKIE=/root/.config/pulse/cookie
