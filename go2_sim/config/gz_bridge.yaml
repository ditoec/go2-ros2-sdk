# Gazebo Harmonic → ROS2 clock bridge for go2_sim.
#
# Sensor topics (/imu, /scan, /go2_camera/*) are bridged separately via the
# positional-argument parameter_bridge node (go2_gz_bridge_sensors) and then
# relayed to SDK root-level names by topic_tools relay nodes.  Keeping sensors
# out of this file avoids duplicate publishers on the same ROS topics.

# Clock bridge (required for use_sim_time)
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
