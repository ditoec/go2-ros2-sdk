# Custom voice command table — operator-editable, no code changes required.
#
# Reload live (no restart needed):
#   ros2 topic pub /reload_custom_commands std_msgs/Empty "{}" --once
#
# Supported action_type values:
#   api_id           — send a robot posture/gesture command (see robot_commands.py for IDs)
#   navigate_to_room — publish room name to /navigate_to_room (requires ENABLE_NAV_WAYPOINT=true)
#   patrol_start     — start patrol mode (requires ENABLE_PATROL=true)
#   patrol_stop      — stop patrol mode
#   follow_start     — enable follow-me mode (requires ENABLE_FOLLOW=true)
#   follow_stop      — disable follow-me mode
#   approach_object  — approach a detected object (requires ENABLE_APPROACH_OBJECT=true + ENABLE_YOLO=true)
#
# trigger_en: comma-separated English phrases
# trigger_id: comma-separated Indonesian phrases
#
# Longer phrases take priority over shorter ones, so list "go to main entrance" before "entrance".
#
custom_commands: {}
#
# Uncomment and customise examples below:
